name: GoalFlowPulse News

on:
  schedule:
    - cron: '30 7 * * *'     # 08:30 WAT daily -> UTC 07:30
    - cron: '30 19 * * *'    # 20:30 WAT daily -> UTC 19:30
  workflow_dispatch:
    inputs:
      command:
        description: 'Optional command to run (news)'
        required: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: news_db.sqlite
          key: news-db-${{ runner.os }}-v1

      - name: Run news
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          COMMAND: news
        run: |
          python bot.py
          - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add matches.db
          git commit -m "Update match database [skip ci]" || echo "No changes to commit"
          git push

      - name: Save DB cache
        uses: actions/cache@v4
        with:
          path: news_db.sqlite
          key: news-db-${{ runner.os }}-v1
