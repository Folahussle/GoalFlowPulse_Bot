name: GoalPulse Bot Engine
on:
  schedule:
    - cron: '*/15 * * * *'   # Scores every 15 minutes
    - cron: '0 9 * * *'      # Morning news at 9 AM
    - cron: '0 21 * * *'     # Night news at 9 PM
  workflow_dispatch:          # Manual run for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests python-telegram-bot==13.7
      - name: Execute Bot
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python bot.py
