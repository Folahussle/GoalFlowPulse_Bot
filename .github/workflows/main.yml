name: GoalFlowPulse Bot Runner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Bot (Test Mode)
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        CHANNEL_NAME: ${{ secrets.CHANNEL_NAME }}
      # This runs the bot. Note: GitHub Actions will timeout after 6 hours.
      run: python bot.py
