name: GoalFlowPulse Bot

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Keep the bot running - runs every 6 hours to prevent workflow timeout
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔑 Create .env file from secrets
      run: |
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
        echo "FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}" >> .env
        echo "CHANNEL_NAME=${{ secrets.CHANNEL_NAME }}" >> .env
    
    - name: ✅ Test bot connection
      run: |
        python -c "
        import requests
        import os
        from dotenv import load_dotenv
        
        load_dotenv()
        token = os.getenv('TELEGRAM_BOT_TOKEN')
        
        response = requests.get(f'https://api.telegram.org/bot{token}/getMe')
        if response.status_code == 200:
            print('✅ Bot connection successful!')
            print(f'Bot username: @{response.json()[\"result\"][\"username\"]}')
        else:
            print('❌ Bot connection failed!')
            exit(1)
        "
    
    - name: 🤖 Run bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        CHANNEL_NAME: ${{ secrets.CHANNEL_NAME }}
      run: |
        # Run bot for 5.5 hours (GitHub Actions has 6 hour timeout)
        timeout 19800 python bot.py || echo "Bot session completed"
      continue-on-error: true
    
    - name: 📊 Check bot status
      if: always()
      run: |
        echo "Bot execution completed"
        echo "Next scheduled run will start automatically"
