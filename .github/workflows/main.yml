name: GoalFlowPulse Scheduler

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes -> live scores (UTC)
    - cron: '30 7 * * *'     # 08:30 WAT daily -> morning news (UTC 07:30)
    - cron: '30 19 * * *'    # 20:30 WAT daily -> evening news (UTC 19:30)
  workflow_dispatch:
    inputs:
      command:
        description: 'Optional command to run (news, livescores, leagues)'
        required: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore news DB cache
        uses: actions/cache@v4
        with:
          path: news_db.sqlite
          key: news-db-${{ runner.os }}-v1

      - name: Run bot
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          COMMAND: ${{ github.event.inputs.command || '' }}
        run: |
          # Determine which task to run based on the cron trigger time or manual input
          # If COMMAND provided via workflow_dispatch, bot will run that command.
          python bot.py

      - name: Save news DB cache
        uses: actions/cache@v4
        with:
          path: news_db.sqlite
          key: news-db-${{ runner.os }}-v1