name: GoalFlowPulse Bot Engine

# Schedules use UTC. Nigeria is UTC+1.
on:
  schedule:
    - cron: '*/15 * * * *'   # Live scores every 15 minutes
    - cron: '30 7 * * *'     # Major news & confirmed transfer news at 07:30 UTC (08:30 Nigeria)
    - cron: '30 19 * * *'    # Major news & confirmed transfer news at 19:30 UTC (20:30 Nigeria)
    # Transfer rumours: frequent during transfer windows (every 2 hours).
    # Set TRANSFER_WINDOW=true in workflow_dispatch or repo env to enable frequent rumours.
    - cron: '0 */2 * * *'    # Rumours every 2 hours (use with TRANSFER_WINDOW=true)
    - cron: '30 7 * * *'     # Fallback: rumours once daily at 07:30 UTC (08:30 Nigeria)
  workflow_dispatch:         # Allows manual runs for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      # Secrets (set these in GitHub repo Settings → Secrets and variables → Actions)
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
      # Control flags (optional): set TRANSFER_WINDOW=true in repo secrets or when manually running
      TRANSFER_WINDOW: ${{ secrets.TRANSFER_WINDOW }}   # optional: "true" or "false"
      RUN_MODE: "SCHEDULE"  # keep SCHEDULE for GitHub Actions runs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests python-telegram-bot==13.15; fi
      - name: Run bot script
        # The script decides what to post based on UTC time and TRANSFER_WINDOW flag.
        run: |
          echo "Running GoalFlowPulse scheduled job (UTC): $(date -u)"
          python bot.py
      - name: Upload logs (optional)
        if: failure()
        run: |
          echo "Workflow failed. Check logs above."
