name: Football Bot Scheduler

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes -> live scores
    - cron: '30 7 * * *'     # 08:30 WAT daily -> morning news (UTC 07:30)
    - cron: '30 19 * * *'    # 20:30 WAT daily -> evening news (UTC 19:30)
  workflow_dispatch:         # manual run for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run bot (live scores)
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          COMMAND: ${{ github.event.inputs.command || '' }}
        run: |
          # Decide which task to run based on the cron that triggered the workflow
          # If triggered manually with workflow_dispatch and 'command' input, pass it to the bot
          python bot.py